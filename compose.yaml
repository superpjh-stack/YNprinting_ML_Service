name: ynprinting-ml
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8042:8042"
    environment:
      YN_RUNTIME: /data
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    volumes:
      - runtime:/data
      - references:/app/output/reference-images:ro
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  runtime:
  references:
